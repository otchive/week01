{% extends 'base.html' %} {% block content %}

<style>
    .closet-image {
        width: 100%;
        height: 500px;
        object-fit: contain;
    }
</style>

<div class="box m-5">
    <div class="level">
        <div class="level-left">
            <p class="is-size-1 mb-4 has-text-weight-extrabold">옷 상세</p>
        </div>

        <div class="level-right">
            <label for="logout">{{user}}님으로 로그인됨</label>
            <button class="button is-danger" id="logout" onclick="proceedLogout()">
                로그아웃
            </button>
        </div>
    </div>
    <hr />

    <div class="columns is-vcentered">
        <div class="column is-5">
            <div class="card">
                <div class="card-image">
                    <figure class="image is-4by3">
                        <img src="{{ item.image_url }}" alt="옷 이미지" class="closet-image" />
                    </figure>
                </div>
            </div>
        </div>

        <div class="column is-7">
            <div class="card">
                <div class="card-header">
                    <p class="card-header-title is-size-4">옷 상세 정보</p>
                </div>
            </div>
            <div class="card-content">
                <form id="detail-form">
                    <table class="table is-fullwidth">
                        <tbody>
                            <tr>
                                <th>상품명</th>
                                <td>
                                    <span class="view-mode">{{ item.name }}</span>
                                    <input class="input is-small edit-mode is-hidden" type="text" name="name"
                                        value="{{ item.name }}">
                                </td>
                            </tr>
                            <tr>
                                <th>브랜드</th>
                                <td>
                                    <span class="view-mode">{{ item.brand }}</span>
                                    <input class="input is-small edit-mode is-hidden" type="text" name="brand"
                                        value="{{ item.brand }}">
                                </td>
                            </tr>
                            <tr>
                                <th>종류</th>
                                <td>
                                    <span class="view-mode">{{ item.type }}</span>
                                    <div class="select is-small edit-mode is-hidden">
                                        <select name="type">
                                            <option value="상의" {% if item.type=="상의" %}selected{% endif %}>상의</option>
                                            <option value="하의" {% if item.type=="하의" %}selected{% endif %}>하의</option>
                                            <option value="외투" {% if item.type=="외투" %}selected{% endif %}>외투</option>
                                            <option value="신발" {% if item.type=="신발" %}selected{% endif %}>신발</option>
                                            <option value="액세서리" {% if item.type=="액세서리" %}selected{% endif %}>액세서리
                                            </option>
                                        </select>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th>사이즈</th>
                                <td>
                                    <span class="view-mode">{{ item.size }}</span>
                                    <div class="select is-small edit-mode is-hidden">
                                        <select name="size">
                                            <option value="FREE" {% if item.size=="FREE" %}selected{% endif %}>FREE
                                            </option>
                                            <option value="XS" {% if item.size=="XS" %}selected{% endif %}>XS</option>
                                            <option value="S" {% if item.size=="S" %}selected{% endif %}>S</option>
                                            <option value="M" {% if item.size=="M" %}selected{% endif %}>M</option>
                                            <option value="L" {% if item.size=="L" %}selected{% endif %}>L</option>
                                            <option value="XL" {% if item.size=="XL" %}selected{% endif %}>XL</option>
                                            <option value="XXL" {% if item.size=="XXL" %}selected{% endif %}>XXL
                                            </option>
                                        </select>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th>시즌</th>
                                <td>
                                    <span class="view-mode">{{ item.season }}</span>
                                    <div class="select is-small edit-mode is-hidden">
                                        <select name="season">
                                            <option value="SS" {% if item.season=="SS" %}selected{% endif %}>SS</option>
                                            <option value="AW" {% if item.season=="AW" %}selected{% endif %}>AW</option>
                                            <option value="FW" {% if item.season=="FW" %}selected{% endif %}>FW</option>
                                        </select>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th>구매날짜</th>
                                <td>
                                    <span class="view-mode">{{ item.buy_date }}</span>
                                    <input class="input is-small edit-mode is-hidden" type="date" name="buy_date"
                                        value="{{ item.buy_date }}">
                                </td>
                            </tr>
                            <tr>
                                <th>가격</th>
                                <td>
                                    <span class="view-mode">{{ item.price }}원</span>
                                    <input class="input is-small edit-mode is-hidden" type="number" name="price"
                                        step="1000" min="0" value="{{ item.price }}">
                                </td>
                            </tr>
                            <tr>
                                <th>구매처</th>
                                <td>
                                    <span class="view-mode">{{ item.buy_method }}</span>
                                    <input class="input is-small edit-mode is-hidden" type="text" name="buy_method"
                                        value="{{ item.buy_method }}">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </form>

                <div class="field is-grouped">
                    <p class="control">
                        <button class="button is-primary" id="wear-count">
                            착용횟수: {{ item.wear_count | default(0) }}회
                        </button>
                    </p>
                    <p class="control">
                        <button class="button is-info" onclick="wearItem('{{ item._id }}')">
                            오늘 입었어요 (+1)
                        </button>
                    </p>
                </div>

                <div class="buttons view-mode">
                    <button class="button is-warning" onclick="toggleEditMode(true)">수정</button>
                    <button class="button is-danger" onclick="deleteItem('{{ item._id }}')">삭제</button>
                    <button class="button {% if item.is_life_fit %}is-light{% else %}is-success{% endif %}"
                        onclick="toggleLifeFit('{{ item._id }}')">
                        {% if item.is_life_fit %}
                        인생핏 취소
                        {% else %}
                        인생핏 등록
                        {% endif %}
                    </button>
                </div>

                <div class="buttons edit-mode is-hidden">
                    <button class="button is-success" onclick="saveChanges('{{ item._id }}')">저장</button>
                    <button class="button is-light" onclick="toggleEditMode(false)">취소</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/detail.js') }}"></script>

{% endblock %}
