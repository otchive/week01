{% extends 'base.html' %}
{% block content %}
<div class="box m-5">
    <div class="level">
        <div class="level-left">
            <p class="is-size-1 mb-4 has-text-weight-extrabold">마이페이지</p>
        </div>

        <div class="level-right">
            <label for="logout">{{user}}님으로 로그인됨</label>
            <button class="button is-danger" id="logout" onclick="proceedLogout()">로그아웃</button>
        </div>
    </div>
    <hr />
    <div class="fixed-grid has-2-cols has-1-cols-mobile">
        <div class="grid has-text-centered">
            <div class="cell">
                <div class="box">
                    <p class="is-size-3 has-text-weight-semibold">42</p>
                    <p>총 보유 옷 수</p>
                </div>
            </div>
            <div class="cell">
                <div class="box">
                    <p class="is-size-3 has-text-weight-semibold">₩1,530,000</p>
                    <p>총 구매 금액</p>
                </div>
            </div>
            <div class="cell">
                <div class="box">
                    <p class="is-size-3 has-text-weight-semibold">니트가디건</p>
                    <p>가장 많이 입은 옷</p>
                </div>

            </div>
            <div class="cell">
                <div class="box">
                    <p class="is-size-3 has-text-weight-semibold">릭오웬스 팬츠</p>
                    <p>가장 적게 입은 옷</p>
                </div>
            </div>
        </div>
    </div>
    <div style="text-align: center;">
        <a href="/closet/unworn" class="button is-primary" style="text-align: center;">안 입는 옷 보러가기</a>
    </div>
</div>
<hr/>
<div class="buttons m-5">
    <div class="button">옷장</div>
    <div class="button">등록</div>
    <div class="button">인생핏</div>
    <div class="button is-primary">마이</div>
</div>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script></script>
{% endblock %}
